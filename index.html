<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Расходы</title><meta name="theme-color" content="#0f1420"><link rel="manifest" href="./manifest.json"><link rel="icon" type="image/svg+xml" href="./icon.svg"><style>:root{--bg:#0f1420;--card:#171e2e;--card2:#1e2739;--line:#2a3549;--text:#e8edf7;--muted:#8b98b0;--accent:#4f8cff;--green:#2fd07b;--red:#ff5c72;--yellow:#ffc247}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1b2740 0%,var(--bg) 60%);color:var(--text);min-height:100vh;padding:24px 16px 60px;padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(60px + env(safe-area-inset-bottom))}.wrap{max-width:960px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.card h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.stat .label{font-size:12px;color:var(--muted);margin-bottom:6px}.stat .value{font-size:20px;font-weight:700}.stat .value.small{font-size:16px}form.add{display:grid;grid-template-columns:120px 1fr 1fr 140px auto;gap:10px}@media(max-width:720px){form.add{grid-template-columns:1fr 1fr}form.add .wide{grid-column:1/-1}}input,select,button{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;min-width:0}input:focus{border-color:var(--accent)}input[type="date"],input[type="month"]{color-scheme:dark}button{cursor:pointer;background:var(--accent);border-color:var(--accent);font-weight:600;transition:.15s}button:hover{filter:brightness(1.1)}button.ghost{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500}button.ghost:hover{color:var(--text);border-color:var(--accent)}button.danger{background:transparent;border-color:transparent;color:var(--red);padding:4px 8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar .spacer{flex:1}ul.list{list-style:none;margin:0;padding:0}ul.list li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px}ul.list li:last-child{border-bottom:none}.li-date{color:var(--muted);font-size:12px;width:82px;flex-shrink:0}.li-cat{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;flex-shrink:0}.li-note{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li-amount{margin-left:auto;font-weight:700;flex-shrink:0}.bar-row{margin-bottom:14px}.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.bar-head .muted{color:var(--muted)}.bar-track{height:8px;background:var(--card2);border-radius:999px;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:var(--accent);transition:width .3s}.bar-fill.over{background:var(--red)}.bar-fill.warn{background:var(--yellow)}.limit-row{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;margin-bottom:8px}.empty{color:var(--muted);font-size:14px;padding:8px 0}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;font-size:14px;z-index:10}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.neg{color:var(--red)}.pos{color:var(--green)}</style></head><body><div class="wrap"><h1>💰 Расходы</h1><div class="sub"><span>Данные хранятся в браузере.</span><button class="ghost" id="btn-install" hidden>📲 Установить</button></div><div class="stats"><div class="stat"><div class="label">Потрачено за месяц</div><div class="value" id="s-total">0 ₽</div></div><div class="stat"><div class="label">Записей</div><div class="value" id="s-count">0</div></div><div class="stat"><div class="label">Больше всего</div><div class="value small" id="s-top">—</div></div><div class="stat"><div class="label">Средний чек</div><div class="value small" id="s-avg">—</div></div></div><div class="card"><h2>Добавить расход</h2><form class="add" id="form-add" autocomplete="off"><input type="number" id="f-amount" placeholder="Сумма" step="0.01" min="0.01" required inputmode="decimal"><input type="text" id="f-cat" placeholder="Категория" list="cats" class="wide" required><input type="text" id="f-note" placeholder="Комментарий" class="wide"><input type="date" id="f-date"><button type="submit">Добавить</button></form><datalist id="cats"></datalist></div><div class="card"><div class="toolbar"><h2 style="margin:0">Расходы</h2><div class="spacer"></div><input type="month" id="f-month"><button class="ghost" id="btn-csv" type="button">CSV</button><button class="ghost" id="btn-backup" type="button">Бэкап</button><button class="ghost" id="btn-restore" type="button">Восст.</button><input type="file" id="file-restore" accept="application/json" hidden></div><ul class="list" id="list"></ul><div class="empty" id="list-empty" hidden>За этот месяц записей нет.</div></div><div class="card"><h2>Отчёт по категориям</h2><div id="report"></div><div class="empty" id="report-empty" hidden>Нет данных.</div></div><div class="card"><h2>Лимиты на месяц</h2><div class="limit-row"><input type="text" id="l-cat" placeholder="Категория" list="cats"><input type="number" id="l-sum" placeholder="Лимит ₽" step="1" min="1" inputmode="numeric"><button type="button" id="btn-limit">Задать</button></div><div id="limits"></div></div></div><div class="toast" id="toast"></div><script>(function(){"use strict";var STORAGE_KEY="expenses_v1";var DEFAULT_CATS=["еда","транспорт","жильё","развлечения","здоровье","прочее"];var state={expenses:[],budgets:{}};var currentMonth=todayStr().slice(0,7);function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}function pad(n){return n<10?"0"+n:""+n}function money(n){return new Intl.NumberFormat("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+" ₽"}function moneyShort(n){return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n)+" ₽"}function normCat(s){return String(s).trim().toLowerCase().slice(0,30)}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function monthBounds(m){var parts=m.split("-");var y=+parts[0],mo=+parts[1];var start=new Date(y,mo-1,1);var end=new Date(y,mo,0);return{start:y+"-"+pad(mo)+"-01",end:y+"-"+pad(mo)+"-"+pad(end.getDate())}}function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},2200)}function load(){try{var raw=localStorage.getItem(STORAGE_KEY);if(raw){var data=JSON.parse(raw);state.expenses=Array.isArray(data.expenses)?data.expenses:[];state.budgets=data.budgets&&typeof data.budgets==="object"?data.budgets:{}}}catch(e){console.warn(e)}}function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function expensesOfMonth(m){var b=monthBounds(m);return state.expenses.filter(function(e){return e.date>=b.start&&e.date<=b.end}).sort(function(a,b2){if(a.date!==b2.date)return a.date<b2.date?1:-1;return b2.id-a.id})}function render(){var list=expensesOfMonth(currentMonth);var total=list.reduce(function(s,e){return s+e.amount},0);document.getElementById("s-total").textContent=money(total);document.getElementById("s-count").textContent=list.length;var byCat={};list.forEach(function(e){byCat[e.category]=(byCat[e.category]||0)+e.amount});var topCat=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]})[0];document.getElementById("s-top").textContent=topCat?topCat+" · "+moneyShort(byCat[topCat]):"—";document.getElementById("s-avg").textContent=list.length?moneyShort(total/list.length):"—";var ul=document.getElementById("list");ul.innerHTML="";document.getElementById("list-empty").hidden=list.length>0;list.forEach(function(e){var li=document.createElement("li");li.innerHTML='<span class="li-date">'+esc(e.date)+'</span><span class="li-cat">'+esc(e.category)+'</span><span class="li-note">'+esc(e.note||"")+'</span><span class="li-amount">'+money(e.amount)+'</span><button class="danger" type="button" title="Удалить" data-id="'+e.id+'">✕</button>';ul.appendChild(li)});renderReport(byCat,total);renderLimits(byCat);renderDatalist()}function renderReport(byCat,total){var box=document.getElementById("report");box.innerHTML="";var cats=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a]});document.getElementById("report-empty").hidden=cats.length>0;if(!cats.length)return;var max=byCat[cats[0]]||1;cats.forEach(function(c){var share=total?(byCat[c]/total*100):0;var w=Math.max(2,(byCat[c]/max)*100);var row=document.createElement("div");row.className="bar-row";row.innerHTML='<div class="bar-head"><span>'+esc(c)+'</span><span class="muted">'+money(byCat[c])+' · '+share.toFixed(1)+'%</span></div><div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>';box.appendChild(row)})}function renderLimits(byCat){var box=document.getElementById("limits");box.innerHTML="";var cats=Object.keys(state.budgets).sort();if(!cats.length){box.innerHTML='<div class="empty">Лимитов нет.</div>';return}cats.forEach(function(c){var limit=state.budgets[c];var spent=byCat[c]||0;var left=limit-spent;var pct=limit>0?Math.min(100,spent/limit*100):0;var cls=left<0?"over":(pct>=80?"warn":"");var row=document.createElement("div");row.className="bar-row";row.innerHTML='<div class="bar-head"><span>'+esc(c)+'</span><span class="muted">'+money(spent)+' / '+money(limit)+' · <span class="'+(left<0?"neg":"pos")+'">'+(left<0?"перерасход ":"остаток ")+money(Math.abs(left))+'</span></span></div><div class="bar-track"><div class="bar-fill '+cls+'" style="width:'+pct+'%"></div></div>';box.appendChild(row)})}function renderDatalist(){var set={};DEFAULT_CATS.forEach(function(c){set[c]=1});state.expenses.forEach(function(e){set[e.category]=1});Object.keys(state.budgets).forEach(function(c){set[c]=1});var dl=document.getElementById("cats");dl.innerHTML="";Object.keys(set).sort().forEach(function(c){var o=document.createElement("option");o.value=c;dl.appendChild(o)})}function nextId(){return state.expenses.reduce(function(m,e){return Math.max(m,e.id)},0)+1}function addExpense(amount,category,note,date){state.expenses.push({id:nextId(),date:date,category:category,amount:Math.round(amount*100)/100,note:note||""});save();render()}function removeExpense(id){state.expenses=state.expenses.filter(function(e){return e.id!==id});save();render()}function download(filename,content,type){var blob=new Blob([content],{type:type||"text/plain;charset=utf-8"});var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000)}function exportCSV(){var rows=state.expenses.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id});if(!rows.length){toast("Пусто");return}var lines=["id;date;category;amount;note"];rows.forEach(function(e){var note='"'+String(e.note||"").replace(/"/g,'""')+'"';lines.push([e.id,e.date,e.category,e.amount.toFixed(2),note].join(";"))});download("expenses.csv","\uFEFF"+lines.join("\r\n"),"text/csv;charset=utf-8");toast("CSV сохранён")}function backupJSON(){download("expenses-backup.json",JSON.stringify(state,null,2),"application/json");toast("Бэкап сохранён")}function restoreJSON(file){var reader=new FileReader();reader.onload=function(){try{var data=JSON.parse(reader.result);if(!Array.isArray(data.expenses))throw new Error("нет поля expenses");state.expenses=data.expenses;state.budgets=data.budgets||{};save();render();toast("Данные восстановлены")}catch(e){toast("Ошибка: "+e.message)}};reader.readAsText(file)}function bind(){document.getElementById("f-date").value=todayStr();document.getElementById("f-month").value=currentMonth;document.getElementById("form-add").addEventListener("submit",function(ev){ev.preventDefault();var amount=parseFloat(document.getElementById("f-amount").value);var cat=normCat(document.getElementById("f-cat").value);var note=document.getElementById("f-note").value.trim().slice(0,200);var date=document.getElementById("f-date").value||todayStr();if(!isFinite(amount)||amount<=0){toast("Введите сумму");return}if(!cat){toast("Введите категорию");return}addExpense(amount,cat,note,date);document.getElementById("f-amount").value="";document.getElementById("f-note").value="";document.getElementById("f-amount").focus();toast("Добавлено: "+money(amount))});document.getElementById("list").addEventListener("click",function(ev){var btn=ev.target.closest("button[data-id]");if(!btn)return;if(confirm("Удалить запись?"))removeExpense(+btn.getAttribute("data-id"))});document.getElementById("f-month").addEventListener("change",function(ev){currentMonth=ev.target.value||todayStr().slice(0,7);render()});document.getElementById("btn-limit").addEventListener("click",function(){var cat=normCat(document.getElementById("l-cat").value);var sum=parseFloat(document.getElementById("l-sum").value);if(!cat){toast("Введите категорию");return}if(!isFinite(sum)||sum<=0){toast("Лимит > 0");return}state.budgets[cat]=Math.round(sum*100)/100;save();render();document.getElementById("l-cat").value="";document.getElementById("l-sum").value="";toast("Лимит: "+money(sum))});document.getElementById("btn-csv").addEventListener("click",exportCSV);document.getElementById("btn-backup").addEventListener("click",backupJSON);document.getElementById("btn-restore").addEventListener("click",function(){document.getElementById("file-restore").click()});document.getElementById("file-restore").addEventListener("change",function(ev){var f=ev.target.files[0];if(f)restoreJSON(f);ev.target.value=""})}load();bind();render()})();if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(e){console.warn("SW:",e)})})}var deferredPrompt=null;window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;var btn=document.getElementById("btn-install");if(btn)btn.hidden=false});var installBtn=document.getElementById("btn-install");if(installBtn){installBtn.addEventListener("click",function(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.finally(function(){deferredPrompt=null;installBtn.hidden=true})})}window.addEventListener("appinstalled",function(){var btn=document.getElementById("btn-install");if(btn)btn.hidden=true});</script></body></html>
