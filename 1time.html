<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мастер на час | Алексей</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #f2f2f7; 
      color: #1c1c1e; 
      padding: 20px; 
      line-height: 1.4;
    }
    .card { 
      background: #ffffff; 
      padding: 24px; 
      border-radius: 20px; 
      max-width: 400px; 
      margin: 0 auto; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
    }
    h1 { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #8e8e93; font-size: 14px; margin-bottom: 24px; }
    
    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid #f2f2f7;
      cursor: pointer;
    }
    .item:last-of-type { border-bottom: none; }
    
    .item-left { display: flex; align-items: center; gap: 12px; flex: 1; }
    
    .custom-check {
      width: 24px; height: 24px; 
      border: 2px solid #c7c7cc; 
      border-radius: 50%; 
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    input[type="checkbox"] { display: none; }
    input[type="checkbox"]:checked + .custom-check { background: #007aff; border-color: #007aff; }
    input[type="checkbox"]:checked + .custom-check::after { content: '✔'; color: white; font-size: 14px; }
    
    .item-text { font-size: 16px; font-weight: 500; }
    .price { color: #007aff; font-weight: 600; font-size: 15px; white-space: nowrap; flex-shrink: 0; margin-left: 10px; }
    
    .total-box { 
      background: #f2f2f7; 
      padding: 20px; 
      border-radius: 16px; 
      text-align: center; 
      margin-top: 24px; 
    }
    .total-label { font-size: 14px; color: #8e8e93; margin-bottom: 4px; }
    .total-price { font-size: 34px; font-weight: 800; color: #1c1c1e; }
    
    .btn { 
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: #7c3aed; 
      color: white; 
      text-align: center; 
      padding: 18px; 
      border-radius: 14px; 
      text-decoration: none; 
      font-weight: 600; 
      font-size: 17px; 
      margin-top: 20px; 
      transition: opacity 0.2s;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);
    }
    .btn:active { opacity: 0.8; }
    
    .phone { 
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin-top: 20px; 
      color: #007aff; 
      font-size: 18px; 
      font-weight: 600; 
      text-decoration: none; 
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Алексей</h1>
    <div class="subtitle">Мастер на час • Выезд в день обращения</div>

    <label class="item">
      <div class="item-left">
        <input type="checkbox" class="check" value="1000" data-name="Замена выключателя">
        <div class="custom-check"></div>
        <span class="item-text">Замена выключателя</span>
      </div>
      <span class="price">от 1000 ₽</span>
    </label>

    <label class="item">
      <div class="item-left">
        <input type="checkbox" class="check" value="1000" data-name="Установка стиральной машины">
        <div class="custom-check"></div>
        <span class="item-text">Установка стиральной машины</span>
      </div>
      <span class="price">от 1000 ₽</span>
    </label>

    <label class="item">
      <div class="item-left">
        <input type="checkbox" class="check" value="500" data-name="Сантехнические услуги">
        <div class="custom-check"></div>
        <span class="item-text">Сантехнические услуги</span>
      </div>
      <span class="price">от 500 ₽</span>
    </label>

    <label class="item">
      <div class="item-left">
        <input type="checkbox" class="check" value="1000" data-name="Покраска (за 1 кв.м.)">
        <div class="custom-check"></div>
        <span class="item-text">Покраска (1 кв.м.)</span>
      </div>
      <span class="price">от 1000 ₽</span>
    </label>

    <label class="item">
      <div class="item-left">
        <input type="checkbox" class="check" value="1000" data-name="Сварка">
        <div class="custom-check"></div>
        <span class="item-text">Сварка</span>
      </div>
      <span class="price">от 1000 ₽</span>
    </label>

    <div class="total-box">
      <div class="total-label">Примерная стоимость:</div>
      <div class="total-price">от <span id="total">0</span> ₽</div>
    </div>

    <!-- Вставляю твою ссылку прямо в кнопку -->
    <a href="https://max.ru/u/f9LHodD0cOLzZ40CiCBvnycYq8nVppDsZX0LOrQ6Q3FoNwNUDW8gVAaUmwA" id="max-btn" class="btn" target="_blank">
      <span>💬</span> Отправить в MAX
    </a>
    
    <a href="tel:+79300907656" class="phone">
      <span>📞</span> +7 (930) 090-76-56
    </a>
  </div>

  <script>
    const checks = document.querySelectorAll('.check');
    const totalEl = document.getElementById('total');
    const maxBtn = document.getElementById('max-btn');

    function updateTotal() {
      let sum = 0;
      let items = [];
      
      checks.forEach(c => {
        if (c.checked) {
          sum += parseInt(c.value);
          items.push(c.getAttribute('data-name'));
        }
      });
      
      totalEl.innerText = sum;
      
      let text = "";
      if (items.length > 0) {
        text = "Здравствуйте, Алексей! Хочу заказать:\n" + items.map(i => "• " + i).join("\n") + "\n\nПримерная стоимость: от " + sum + " руб.";
      } else {
        text = "Здравствуйте, Алексей! Хочу узнать стоимость работ.";
      }
      
      // Копируем текст при клике, но не блокируем переход по ссылке
      maxBtn.onclick = function() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text);
        }
      };
    }
    
    checks.forEach(c => c.addEventListener('change', updateTotal));
  </script>
</body>
</html>
