<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Мастер на час</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--tg-theme-bg-color, #fff);
        color: var(--tg-theme-text-color, #000);
        padding: 16px;
        margin: 0;
      }
      h1 { margin-top: 0; }
      .form-group { margin-bottom: 12px; }
      label { display: block; margin-bottom: 4px; font-weight: 500; }
      input, textarea, select {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--tg-theme-hint-color, #ccc);
        border-radius: 8px;
        box-sizing: border-box;
        background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
        color: var(--tg-theme-text-color, #000);
      }
      button {
        width: 100%;
        padding: 14px;
        background-color: var(--tg-theme-button-color, #2481cc);
        color: var(--tg-theme-button-text-color, #fff);
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active { opacity: 0.8; }
      .status { margin-top: 15px; text-align: center; font-size: 14px; }
      .success { color: var(--tg-theme-hint-color, #2ecc71); }
      .error { color: #e74c3c; }
    </style>
  </head>
  <body>
    <h1>Заявка на выезд</h1>
    
    <!-- ВАЖНО: у формы должен быть id="order-form" -->
    <form id="order-form">
      <div class="form-group">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" name="name" required placeholder="Иван Иванов" />
      </div>

      <div class="form-group">
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00" />
      </div>

      <div class="form-group">
        <label for="address">Адрес</label>
        <input type="text" id="address" name="address" required placeholder="Город, улица, дом, кв." />
      </div>

      <div class="form-group">
        <label for="time">Когда удобно?</label>
        <select id="time" name="time">
          <option value="Сегодня">Сегодня</option>
          <option value="Завтра">Завтра</option>
          <option value="В выходные">В выходные</option>
        </select>
      </div>

      <div class="form-group">
        <label for="services">Что нужно сделать?</label>
        <textarea id="services" name="services" rows="3" required placeholder="Например: повесить полку, починить кран..."></textarea>
      </div>

      <div class="form-group">
        <label for="comment">Комментарий (опционально)</label>
        <textarea id="comment" name="comment" rows="2" placeholder="Этаж, код домофона и т.д."></textarea>
      </div>

      <!-- ВАЖНО: у кнопки должен быть id="send-btn" -->
      <button type="button" id="send-btn">Отправить заявку</button>
    </form>

    <div id="status" class="status"></div>

    <script>
      // 1. Инициализация Telegram WebApp
      const tg = window.Telegram.WebApp;
      tg.ready();

      // 2. Получаем initData (подпись) ТОЛЬКО после готовности
      const initData = tg.initData;

      // 3. Находим элементы
      const btn = document.getElementById('send-btn');
      const form = document.getElementById('order-form');
      const statusDiv = document.getElementById('status');

      if (btn && form) {
        btn.addEventListener('click', async (e) => {
          e.preventDefault(); // Отменяем стандартную отправку формы

          // Проверка: если initData нет, значит, мы не в Telegram или ошибка
          if (!initData) {
            statusDiv.className = 'status error';
            statusDiv.textContent = 'Ошибка: Не удалось получить данные Telegram. Обновите мини-апп.';
            return;
          }

          const formData = new FormData(form);
          
          // САМОЕ ВАЖНОЕ: Добавляем подпись от Telegram в форму
          formData.append('initData', initData);

          // Здесь вставьте ВАШ URL из развёртывания (заканчивается на /exec)
          // Пример: https://script.google.com/macros/s/AKfycbx.../exec
          const scriptUrl = 'https://script.google.com/macros/s/AKfycbwoOYxRmzuUwEHptIT8802Ffqqinpnl3cjZEZagmXf8g-Wnq9bfa3pN3d0L26mI7uVx/exec'; 

          statusDiv.className = 'status';
          statusDiv.textContent = 'Отправка...';

          try {
            const response = await fetch(scriptUrl, {
              method: 'POST',
              body: formData
            });

            const result = await response.text();

            if (result === 'OK') {
              statusDiv.className = 'status success';
              statusDiv.textContent = '✅ Заявка успешно отправлена!';
              
              // Можно закрыть приложение после успеха
              // tg.close(); 
            } else {
              statusDiv.className = 'status error';
              statusDiv.textContent = '❌ Ошибка: ' + result;
            }
          } catch (error) {
            console.error('Fetch error:', error);
            statusDiv.className = 'status error';
            statusDiv.textContent = '❌ Ошибка сети. Проверьте интернет.';
          }
        });
      }
    </script>
  </body>
</html>
